[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/github/activity"
  to = "/.netlify/functions/github-activity"
  status = 200

[[redirects]]
  from = "/api/github/activity/refresh"
  to = "/.netlify/functions/github-activity"
  status = 200
